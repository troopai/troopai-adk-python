name: CI

# Lint, type-check, the offline unit suite, the docs build, an examples
# structure check, and a package build. Heavier / networked checks live in
# integration.yml, security.yml, and nightly.yml.
#
# Actions are pinned to major-version tags for readability; Dependabot
# (github-actions, monthly) proposes upgrades. Convert to full-commit-SHA
# pins if/when this repo adopts a stricter supply-chain policy.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Supersede in-flight runs for the same ref — the biggest cheap cost saver.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # Pinned to the ruff-pre-commit hook version so local hooks, the
      # hygiene gate, and CI enforce the same rule set. Bump alongside the
      # pin in .pre-commit-config.yaml.
      - run: pip install ruff==0.15.7
      - run: ruff check src tests examples
      - run: ruff format --check src tests examples

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # mypy is the canonical, blocking gate: it skips third-party library
      # internals (ignore_missing_imports) and stays fast. Strict pyright parses
      # the full litellm dependency graph (~30 min), so it runs full nightly
      # (nightly.yml) rather than blocking every PR.
      - name: mypy (canonical)
        run: mypy -p troopai.adk

  test:
    name: Unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[dev]"
      # Offline unit suite: LLMs are mocked; fakeredis / moto / embedded
      # vector stores keep it self-contained. The coverage gate
      # ([tool.coverage.report] fail_under) applies automatically; raise it
      # toward the real ~83% as the suite stabilises.
      - name: Run unit tests
        # Postgres-backed unit tests need real DB infrastructure and run in
        # integration.yml under the explicit postgres marker.
        # --reruns 2 is a stopgap for two known timing-flaky tests pending
        # root-cause (tracked); it does NOT mask hard failures (those fail every
        # attempt). Remove once the flakes are fixed.
        run: >-
          pytest tests/unit -m "not integration and not postgres"
          -n auto --dist loadfile --reruns 2
          --cov=src/troopai --cov-report=xml --cov-report=term-missing
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: .coverage/coverage.xml
          fail_ci_if_error: false

  docs:
    name: Docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e ".[docs]"
      - name: Build English docs
        run: python -m sphinx -b html docs docs/build/html/en
      # Warnings-as-errors is stricter than `make html`; keep it non-blocking
      # until the docstring/markup warnings are cleaned up (tracked).
      - name: Strict docs check (-W, non-blocking)
        continue-on-error: true
        run: python -m sphinx -W --keep-going -b html docs docs/build/html/en-strict

  examples:
    name: Examples structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e .
      # Byte-compile catches syntax errors without importing (no keys needed).
      - name: Byte-compile examples
        run: python -m compileall -q examples
      # --list classifies every example (discovery + prereq check) and makes
      # zero API calls — confirms the suite is structurally sound with no keys.
      - name: Classify examples (zero-cost)
        run: python examples/run_examples.py --list

  build:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install build twine
      - run: python -m build
      # Validates long-description + the license/classifier metadata.
      - run: python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          retention-days: 7
