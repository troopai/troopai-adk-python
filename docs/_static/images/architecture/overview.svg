<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img"
     aria-label="TroopAI ADK pipeline overview — Input, input guardrails, Agent loop, output guardrails, Result."
     class="themed">
  <defs>
    <style>
      .frame { fill: var(--svg-fill, #eef2f8); stroke: var(--svg-stroke, #1c1e21); stroke-width: 1.5; }
      .box   { fill: #e3f2fd; stroke: #1565c0; stroke-width: 1.5; rx: 12; ry: 12; }
      .loop  { fill: #fff3e0; stroke: #ef6c00; stroke-width: 1.8; rx: 14; ry: 14; }
      .pill  { fill: #c8e6c9; stroke: #2e7d32; stroke-width: 1.3; rx: 18; ry: 18; }
      .label { font-family: 'Inter', sans-serif; fill: var(--svg-text, #1c1e21); font-size: 14px; font-weight: 600; }
      .small { font-family: 'Inter', sans-serif; fill: var(--svg-text, #1c1e21); font-size: 12px; }
      .title { font-family: 'Inter', sans-serif; fill: var(--svg-text, #1c1e21); font-size: 17px; font-weight: 700; }
      .arrow { stroke: var(--svg-stroke, #1c1e21); stroke-width: 1.8; fill: none; marker-end: url(#tri); }
    </style>
    <marker id="tri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="var(--svg-stroke, #1c1e21)"/>
    </marker>
  </defs>
  <rect class="frame" x="10" y="10" width="940" height="340" rx="10"/>
  <text class="title" x="480" y="38" text-anchor="middle">Runner.arun(agent, prompt) — the pipeline</text>

  <!-- Stage 1: Input -->
  <rect class="pill" x="30" y="160" width="120" height="60"/>
  <text class="label" x="90" y="195" text-anchor="middle">Input</text>

  <!-- Stage 2: Input guardrails -->
  <rect class="box" x="170" y="160" width="140" height="60"/>
  <text class="label" x="240" y="190" text-anchor="middle">Input guardrails</text>
  <text class="small" x="240" y="206" text-anchor="middle">PII, jailbreak, relevance</text>

  <!-- Stage 3: Agent loop -->
  <rect class="loop" x="330" y="100" width="320" height="180"/>
  <text class="label" x="490" y="130" text-anchor="middle">Agent loop</text>
  <text class="small" x="490" y="150" text-anchor="middle">LLM ↔ tools ↔ handoffs</text>

  <!-- Inner loop boxes -->
  <rect class="box" x="350" y="170" width="80" height="50"/>
  <text class="small" x="390" y="200" text-anchor="middle">LLM</text>

  <rect class="box" x="450" y="170" width="80" height="50"/>
  <text class="small" x="490" y="200" text-anchor="middle">Tools</text>

  <rect class="box" x="550" y="170" width="80" height="50"/>
  <text class="small" x="590" y="200" text-anchor="middle">Handoffs</text>

  <text class="small" x="490" y="250" text-anchor="middle">bounded by max_turns, max_handoffs, budgets</text>

  <!-- Stage 4: Output guardrails -->
  <rect class="box" x="670" y="160" width="140" height="60"/>
  <text class="label" x="740" y="190" text-anchor="middle">Output guardrails</text>
  <text class="small" x="740" y="206" text-anchor="middle">safety, relevance</text>

  <!-- Stage 5: Result -->
  <rect class="pill" x="830" y="160" width="100" height="60"/>
  <text class="label" x="880" y="195" text-anchor="middle">Result</text>

  <!-- Arrows -->
  <line x1="150" y1="190" x2="168" y2="190" class="arrow"/>
  <line x1="310" y1="190" x2="328" y2="190" class="arrow"/>
  <line x1="650" y1="190" x2="668" y2="190" class="arrow"/>
  <line x1="810" y1="190" x2="828" y2="190" class="arrow"/>

  <!-- footer subsystems -->
  <text class="small" x="480" y="320" text-anchor="middle">Subsystems: guardrails · tools · memory · skills · MCP · tracing · cost · governance</text>
</svg>
